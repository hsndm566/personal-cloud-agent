name: TEMP Investment Lab Ruff Autoformat
on:
  pull_request:
    types: [synchronize]
    paths:
      - '.github/workflows/investment-lab-autofix.yml'
      - 'experiments/investment-lab/**'

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.ref == 'feature/investment-lab-watchlist' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/investment-lab-watchlist
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ruff==0.15.21
      - name: Format new files only and commit
        run: |
          ruff check --fix experiments/investment-lab/lab.py experiments/investment-lab/tests/test_lab.py || true
          ruff format experiments/investment-lab/lab.py experiments/investment-lab/tests/test_lab.py
          git diff --check
          if [ -n "$(git status --porcelain experiments/investment-lab/)" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add experiments/investment-lab/lab.py experiments/investment-lab/tests/test_lab.py
            git commit -m 'style: format investment lab Python sources'
            git push origin HEAD:feature/investment-lab-watchlist
          fi
