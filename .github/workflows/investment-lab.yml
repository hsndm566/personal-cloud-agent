name: Investment Lab (public tests only)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'experiments/investment-lab/**'
      - '.github/workflows/investment-lab.yml'
  push:
    branches: [main]
    paths:
      - 'experiments/investment-lab/**'
      - '.github/workflows/investment-lab.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r experiments/investment-lab/requirements.txt
      - run: python -m unittest discover -s experiments/investment-lab/tests -v
# Production schedules, reports, secrets and notifications belong in the private companion.
# No public artifacts, issue notifications, account configuration or live PR signals.
